#
# Development overrides. Docker Compose applies this file automatically, so
# `docker compose up` on a workstation gets live source without a rebuild.
#
# Deployment must bypass it explicitly:
#
#   docker compose -f compose.yaml up -d
#
# Nothing here should ever be required for the app to function — if the stack
# only works with this file applied, that is a bug in compose.yaml.

services:
  app:
    # Build the dev target so pytest/ruff/mypy are present. The deployment
    # definition (compose.yaml alone) builds `runtime`, which has neither.
    build:
      target: dev
    image: emeye:dev
    volumes:
      # Live source. Read-write because `make revision` / `.\make.ps1 revision`
      # writes generated migrations back into src/.
      - ./src:/app/src
      - ./tests:/app/tests
      - ./scripts:/app/scripts:ro
      - ./alembic.ini:/app/alembic.ini:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
      - emeye-data:/data
